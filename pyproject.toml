[project]
name = "niagads-pylib"
authors = [
    { name = "fossilfriend", email = "egreenfest@gmail.com" },
]
description = "a collection of python packages, classes, and utility functions in support of NIAGADS projects"
license = { text = "GNU GPLv3" }
readme = "README.md"
requires-python = ">=3.12,<3.14"
version = "2.0.0"

[tool.black]
force-exclude = '(^/development/|/alembic/versions/)'

[tool.isort]
extend_skip_glob = [
    "**/alembic/versions/**",
    "development/**",
]
profile = "black"

[tool.poetry]
homepage = "https://github.com/NIAGADS/niagads-pylib"
repository = "https://github.com/NIAGADS/niagads-pylib"

include = [
    { path = "bases/niagads/genomicsdb_etl/plugins/validation_schemas/*.json" },
    { path = "bases/niagads/genomicsdb_etl/plugins/validation_schemas/*.xsd" },
]

[tool.poetry.dependencies]
aiocache = { extras = [
    "redis",
], version = "^0.12.3" }
aiohttp = { extras = [
    "speedups",
], version = "^3.11.16" }
asgi-correlation-id = "^4.3.4"
asyncpg = "^0.30.0"
boto3 = "^1.38.36"
cyvcf2 = "^0.31.1"
email-validator = "^2.2.0"
fastapi = "^0.136.3"
fastapi-cors = "^0.0.6"
ga4gh-vrs = { extras = [
    "extras",
], version = "^2.2.0" }
hgvs = { git = "https://github.com/NIAGADS/hgvs.git", rev = "NIAGADS" }
itsdangerous = "^2.2.0"
jsonschema = "^4.23.0"
lxml = "^6.0.2"
nh3 = "^0.2.21"
openpyxl = "^3.1.5"
oxrdflib = "^0.5.0"
pandas = "^2.2.3"
pgvector = "^0.4.2"
psutil = "^7.1.0"
psycopg2-binary = "^2.9.11"
pydantic = "^2.11.1"
pydantic-settings = "^2.8.1"
pyparsing = "^3.2.3"
pysam = "^0.23.0"
python-dateutil = "^2.9.0.post0"
pyyaml = "^6.0.2"
rdflib = "^7.1.4"
requests = "^2.32.3"
sentence-transformers = "^5.2.2"
spacy = "^3.8.11"
sqlalchemy = { version = "^2.0.40", extras = [
    'asyncio',
] }
sqlalchemy-utils = "^0.43.0"
starlette = "^1.2.0"
streamlit = "^1.55.0"
strenum = "^0.4.15"
transformers = "4.56.2"
typing-extensions = "^4.13.2"
uvicorn = "^0.34.2"
vcfpy = "^0.13.8"
wtforms = "^3.2.1"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
flake8 = "^7.0.0"
ipykernel = "^6.29.5"
isort = "^8.0.1"
lazydoc = "^1.0.1"
mypy = "^1.8.0"
pydocstyle = "^6.3.0"
pytest = "^8.2.2"

[tool.poetry.group.ask]
optional = true

[tool.poetry.group.ask.dependencies]
httpx = "^0.28.1"

[tool.poetry.group.ask.dependencies.pydantic-ai-slim]
version = "2.57.0"
extras = ["openrouter", "ui"]

[tool.poetry.group.ask.dependencies.logfire]
version = "5.2.0"
extras = ["fastapi", "httpx"]
[tool.poetry.scripts]
migrate-gwas = "niagads.genomicsdb_etl.data_migration.migrate_legacy_gwas_to_hipFG_standard:main"
runpipe = "niagads.pipeline_service.runners.core:run_main"
runpipe-export = "niagads.pipeline_service.runners.export_data:run_main"
runpipe-plugin = "niagads.pipeline_service.runners.plugin:run_main"
runpipe-xdb-lookup = "niagads.pipeline_service.runners.xdbref_lookup:run_main"

[tool.pytest.ini_options]
addopts = "-vv"

[tool.tomlsort]
all = true
in_place = true
spaces_indent_inline_array = 4

[tool.polylith.bricks]
"bases/niagads/genomicsdb_etl" = "niagads/genomicsdb_etl"
"bases/niagads/metadata_validator_tool" = "niagads/metadata_validator_tool"
"bases/niagads/open_access_api" = "niagads/open_access_api"
"bases/niagads/pipeline_service" = "niagads/pipeline_service"
"bases/niagads/sql_runner" = "niagads/sql_runner"
"components/niagads/adsp_annotation" = "niagads/adsp_annotation"
"components/niagads/api" = "niagads/api"
"components/niagads/arg_parser" = "niagads/arg_parser"
"components/niagads/bed" = "niagads/bed"
"components/niagads/cache" = "niagads/cache"
"components/niagads/common" = "niagads/common"
"components/niagads/csv_parser" = "niagads/csv_parser"
"components/niagads/csv_triples_parser" = "niagads/csv_triples_parser"
"components/niagads/csv_validator" = "niagads/csv_validator"
"components/niagads/database" = "niagads/database"
"components/niagads/decorators" = "niagads/decorators"
"components/niagads/enums" = "niagads/enums"
"components/niagads/etl" = "niagads/etl"
"components/niagads/excel_parser" = "niagads/excel_parser"
"components/niagads/exceptions" = "niagads/exceptions"
"components/niagads/flatfile" = "niagads/flatfile"
"components/niagads/ga4gh" = "niagads/ga4gh"
"components/niagads/genome_reference" = "niagads/genome_reference"
"components/niagads/json_validator" = "niagads/json_validator"
"components/niagads/metadata_parser" = "niagads/metadata_parser"
"components/niagads/metadata_serializer" = "niagads/metadata_serializer"
"components/niagads/metadata_validator" = "niagads/metadata_validator"
"components/niagads/nlp" = "niagads/nlp"
"components/niagads/objects" = "niagads/objects"
"components/niagads/parquet" = "niagads/parquet"
"components/niagads/postgres_dbi" = "niagads/postgres_dbi"
"components/niagads/rdf_parsers" = "niagads/rdf_parsers"
"components/niagads/requests" = "niagads/requests"
"components/niagads/s3" = "niagads/s3"
"components/niagads/sequence" = "niagads/sequence"
"components/niagads/settings" = "niagads/settings"
"components/niagads/subprocess_manager" = "niagads/subprocess_manager"
"components/niagads/utils" = "niagads/utils"
"components/niagads/vcf" = "niagads/vcf"
"components/niagads/vep_json_parser" = "niagads/vep_json_parser"
[build-system]
build-backend = "poetry.core.masonry.api"
requires = [
    "poetry-core>=2.0.0,<3.0.0",
]

# Pinned this version for compatibility with the LFM2.5 embedding model.
# transformers = "4.56.2"
